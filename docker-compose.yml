services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kennen_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-kennen}
    volumes:
      - kennen-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kennen_app} -d ${DB_NAME:-kennen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${DB_NAME:-kennen};Username=${DB_USER:-kennen_app};Password=${DB_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-https://api.kennen-technologies.com}
      Jwt__Audience: ${JWT_AUDIENCE:-kennen-website}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_DAYS:-7}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:?FRONTEND_URL is required}
      Seed__AdminEmail: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Seed__SeedContent: "true"
      Database__AutoMigrate: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - kennen-storage:/app/storage

volumes:
  kennen-db:
  kennen-storage:
